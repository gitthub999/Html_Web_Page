<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Full Info Auto</title>
<style>
 body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:10px}
.box{background:#fff;padding:20px;border-radius:15px;width:100%;max-width:500px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
 #output{background:#f8f9fa;padding:15px;border-radius:12px;font-size:14px;line-height:2.2;margin-top:10px}
 b{color:#000} span{color:#007bff;font-weight:bold}
</style>
</head>
<body>
<div class="box">
  <h3 style="text-align:center">📱 Live Full Tracker</h3>
  <div id="output">⌛ Location Allow koren...</div>
</div>

<script>
function getRealBrand(){
  const ua = navigator.userAgent.toLowerCase();
  if(ua.includes("iphone")) return "Apple iPhone";
  if(ua.includes("samsung") || ua.includes("sm-")) return "Samsung";
  if(ua.includes("redmi") || ua.includes("xiaomi") || ua.includes(" mi ") || ua.includes("poco")) return "Xiaomi / Redmi / POCO";
  if(ua.includes("oppo") || ua.includes("cph")) return "OPPO";
  if(ua.includes("vivo") || ua.includes("v2")) return "Vivo";
  if(ua.includes("realme") || ua.includes("rmx")) return "Realme";
  if(ua.includes("infinix")) return "Infinix";
  if(ua.includes("tecno")) return "Tecno";
  if(ua.includes("huawei") || ua.includes("honor")) return "Huawei / Honor";
  if(ua.includes("oneplus")) return "OnePlus";
  return "Android Phone";
}

async function startLive(){
  const out = document.getElementById("output");
  const ua = navigator.userAgent;
  let browser = "Unknown";
  if(ua.includes("Chrome") && !ua.includes("Edg") && !ua.includes("OPR")) browser = "Chrome";
  else if(ua.includes("Firefox")) browser = "Firefox";
  else if(ua.includes("Edg")) browser = "Edge";
  else if(ua.includes("OPR") || ua.includes("Opera")) browser = "Opera";
  else if(ua.includes("Safari") && !ua.includes("Chrome")) browser = "Safari";

  const brand = getRealBrand();
  let model = "Hidden (Browser Block)";
  if(navigator.userAgentData){
    try{
      const d = await navigator.userAgentData.getHighEntropyValues(["model"]);
      if(d.model) model = d.model;
    }catch(e){}
  }

  navigator.geolocation.watchPosition(async (pos) => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const time = new Date().toLocaleString("en-BD", {timeZone:"Asia/Dhaka", hour12:true});
    let batteryText = "Not Supported";
    if(navigator.getBattery){
      const b = await navigator.getBattery();
      batteryText = Math.round(b.level*100) + "% " + (b.charging? "⚡ Charging" : "🔋");
    }
    let placeName = "Loading...";
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
      const data = await res.json();
      placeName = data.display_name || "Address not found";
    }catch(e){ placeName = "Address failed"; }

    out.innerHTML = `
      <b>Phoner Brand:</b> <span>${brand}</span><br>
      <b>Phone Model:</b> <span>${model}</span><br>
      <b>Browser Name:</b> <span>${browser}</span><br>
      <b>Battery Charge:</b> <span>${batteryText}</span><br>
      <b>Time (BD):</b> <span>${time}</span><br>
      <b>Latitude:</b> <span>${lat.toFixed(6)}</span><br>
      <b>Longitude:</b> <span>${lng.toFixed(6)}</span><br>
      <b>Jagar Name:</b> <span>${placeName}</span><br><br>
      <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">📍 Map e Dekho</a>
    `;
  }, (err) => {
    out.innerHTML = "❌ Please Allow Location: " + err.message;
  }, {enableHighAccuracy:true});
}

window.onload = startLive;
</script>
</body>
</html>
