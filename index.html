<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Info</title>
<style>
 body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
 .box{background:#fff;padding:25px;border-radius:15px;text-align:left;box-shadow:0 4px 15px rgba(0,0,0,.1);width:90%;max-width:450px}
 button{background:#007bff;color:#fff;border:none;padding:14px 28px;border-radius:25px;font-size:17px;cursor:pointer;width:100%}
 #output{margin-top:20px;font-size:15px;line-height:2;background:#f8f9fa;padding:15px;border-radius:10px}
 b{color:#007bff}
</style>
</head>
<body>
<div class="box">
  <h2 style="text-align:center">📍 Live Info</h2>
  <button id="viewBtn">Click to View Live Info</button>
  <div id="output">Click button</div>
</div>

<script>
const btn = document.getElementById("viewBtn");
const output = document.getElementById("output");

btn.addEventListener("click", () => {
  output.innerHTML = "⌛ Permission...";
  
  navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      const time = new Date().toLocaleString("en-US", {timeZone: "Asia/Dhaka"});
      const phone = navigator.userAgent;
      const platform = navigator.platform;
      const connection = navigator.connection ? navigator.connection.effectiveType + " / " + navigator.connection.type : "Unknown";
      const battery = navigator.getBattery ? "Checking..." : "Not supported";
      
      output.innerHTML = `
        <b>Latitude:</b> ${lat}<br>
        <b>Longitude:</b> ${lng}<br>
        <b>Time (BD):</b> ${time}<br>
        <b>Device:</b> ${platform}<br>
        <b>Model/Browser:</b> ${phone.substring(0,80)}...<br>
        <b>Network Mode:</b> ${connection}<br>
        <b>Accuracy:</b> ${Math.round(pos.coords.accuracy)} meter
      `;
      
      if(navigator.getBattery){
        navigator.getBattery().then(b => {
          output.innerHTML += `<br><b>Battery:</b> ${Math.round(b.level*100)}% ${b.charging ? '(Charging)' : ''}`;
        });
      }
    },
    (err) => {
      output.innerHTML = `❌ ${err.message}`;
    },
    {enableHighAccuracy:true, maximumAge:0}
  );
});
</script>
</body>
</html>
